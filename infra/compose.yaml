# Infrastructure only. Keep the high-trust Runner on a separate execution node.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: buildmedic
      POSTGRES_USER: buildmedic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildmedic"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
