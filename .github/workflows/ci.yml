name: BuildMedic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --extra adaptive
      - run: uv run --extra adaptive pytest -q
      - name: Confirm generated contracts are current
        run: |
          uv run --extra adaptive python scripts/export_contracts.py
          git diff --exit-code -- packages/contracts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: apps/web/test-results
          retention-days: 7

  docker-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run python scripts/build_runner.py
      - name: Run original and patched checks in the built image
        run: |
          BUILDMEDIC_TEST_DOCKER_IMAGE=$(docker image inspect buildmedic-pytest:local --format '{{.Id}}') uv run pytest tests/integration/test_docker_runner.py -q
