[project]
name = "buildmedic"
version = "0.1.0"
description = "Evidence-driven CI failure diagnosis and independent patch verification"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "celery[redis]>=5.5,<6",
  "pytest>=8.3,<10"
]
[dependency-groups]
dev = ["ruff>=0.11,<1"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["buildmedic*"]
[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/integration"]
[tool.ruff]
line-length = 110
