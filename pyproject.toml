[project]
name = "buildmedic"
version = "0.2.0"
description = "Evidence-driven CI failure diagnosis and independent patch verification"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "httpx[socks]>=0.28,<1", "celery[redis]>=5.5,<6",
  "pytest>=8.3,<10"
]

[project.optional-dependencies]
adaptive = [
    "harness2",
]
[dependency-groups]
dev = ["ruff>=0.11,<1"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["buildmedic*", "scorer_service*"]
[tool.pytest.ini_options]
testpaths = ["tests/backend", "tests/integration"]
[tool.ruff]
line-length = 110

[tool.uv.sources]
harness2 = { git = "https://github.com/google-research/harness2.git", rev = "1cfe254e8d25b15f37048c3730134686abe60335" }
